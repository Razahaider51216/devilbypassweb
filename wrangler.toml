name = "devilbypassweb"
main = "dist/server/server.js"
compatibility_date = "2026-08-24"
compatibility_flags = ["nodejs_compat"]

# Keep this enabled until a Custom Domain has been attached. Once the domain
# works, change this to false so attackers cannot bypass the zone WAF by using
# the public *.workers.dev hostname.
workers_dev = false

[assets]
directory = "./dist/client"
binding = "ASSETS"
run_worker_first = false

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
